[package]
name = "attic-numa"
version.workspace = true
edition.workspace = true
publish = false

# NUMA topology discovery, a port of the reference's `NumaConfig` machinery
# (`numa.h`). std only, plus `libc` on Linux for `sched_getaffinity`.
[dependencies]

# Target-gated as well as `cfg`-gated in code, so other targets never pull it
# in: their affinity path falls back to "all system threads" without libc.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
