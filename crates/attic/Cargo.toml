[package]
name = "attic"
version.workspace = true
edition.workspace = true
publish = false

# The `[[test]]` below is not auto-discovered: it lives one directory down.
[[test]]
name = "parity_perft"
path = "tests/parity/perft.rs"

[dependencies]
attic-protocol = { path = "../attic-protocol", default-features = false }
attic-state = { path = "../attic-state", default-features = false }

# Global allocator for the shipped binary only; every library crate stays
# allocator-agnostic. `secure` is left off: it costs throughput for hardening
# this engine has no threat model for. The reference build uses the system
# allocator, so this is a performance divergence with no semantic effect.
mimalloc = "0.1"

# Pass-through only; see `attic-state/Cargo.toml`. This crate builds the shipped
# binary, so its default is what a release gets.
[features]
default = ["quick-draw"]
quick-draw = ["attic-protocol/quick-draw", "attic-state/quick-draw"]

[dev-dependencies]
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
