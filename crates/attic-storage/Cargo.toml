[package]
name = "attic-storage"
version.workspace = true
edition.workspace = true
publish = false

# Storage layer: a substrate, depending on std and utility crates only and
# importing no other workspace crate. The transposition table therefore speaks
# in primitives rather than State-layer types, and the Search layer, which owns
# both, adapts between them.
[dependencies]

# `madvise(MADV_HUGEPAGE)` over the transposition-table allocation, mirroring
# the reference's `aligned_large_pages_alloc`. `cfg(unix)`-gated so non-Unix
# targets never pull it in.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
