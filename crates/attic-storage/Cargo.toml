[package]
name = "attic-storage"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

# Storage layer: a substrate, depending on std and utility crates only and
# importing no other workspace crate. The transposition table therefore speaks
# in primitives rather than State-layer types, and the Search layer, which owns
# both, adapts between them.
[dependencies]

# `mmap` / `madvise(MADV_HUGEPAGE)` / `munmap` for the large-page allocations,
# mirroring the reference's `aligned_large_pages_alloc`. Gated on the same cfg as the
# code that calls it: other targets, and miri (which cannot run a foreign call), take the
# `std::alloc` fallback and never pull it in.
[target.'cfg(all(target_os = "linux", not(miri)))'.dependencies]
libc = "0.2"
