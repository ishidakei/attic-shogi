[package]
name = "attic-state"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]

# `quick-draw` mirrors upstream's `ENABLE_QUICK_DRAW` (`config.h`), which
# the reference's `FOR_TOURNAMENT` build defines: the query-time repetition walk
# in `Position::is_repetition` — second occurrence adjudicates, no
# `repetition < ply` root gate — rather than the incremental `do_move`
# precompute. `--no-default-features` restores the other variant.
[features]
default = ["quick-draw"]
quick-draw = []

[dev-dependencies]
proptest = "~1.11"
serde_json = "~1.0"
