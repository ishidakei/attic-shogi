# cargo-deny configuration (`cargo deny check`).
#
# The graph is resolved for x86-64 Linux alone, the only target this repository
# supports; auditing the Windows/wasm cfg-gated halves of the tree would report
# on code that can never ship here.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
# Every check runs with `--all-features`, so a feature-gated dependency
# must be audited too.
all-features = true
# Dev-dependencies build and run in the tests, so they are audited too even
# though they never ship in the engine binary.
exclude-dev = false

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# An entry here is an accepted vulnerability, and needs a comment saying who
# accepted it and why.
ignore = []

# The engine is distributed under GPL-3.0 (see LICENSE), so every dependency
# must be under a licence that can be combined into a GPL-3.0 work.
[licenses]
# Exactly the licences the current graph resolves to, nothing speculative:
# leaving room "just in case" would let a licence slip in unread.
allow = [
  "MIT",
  "Apache-2.0",
  # `unicode-ident` is `(MIT OR Apache-2.0) AND Unicode-3.0` — the Unicode data
  # tables carry their own permissive licence on top of the code licence.
  "Unicode-3.0",
]
# Above the 0.8 default, so a mangled or non-standard LICENSE file is reported
# as unlicensed rather than fuzzy-matched to something close.
confidence-threshold = 0.93
# An entry here is a licence accepted for one crate only, and needs a comment
# saying why.
exceptions = []

# The workspace's own crates carry no `license` field: none is published, and
# the distribution terms are the repository's single top-level LICENSE.
[licenses.private]
ignore = true

[bans]
# Duplicate versions are visible noise, not a correctness problem.
multiple-versions = "warn"
# A `version = "*"` dependency makes the build non-reproducible.
wildcards = "deny"
# …except between the workspace's own crates, which depend on each other by
# `path` and resolve inside this repository.
allow-wildcard-paths = true

# The engine must never be able to open a network socket, enforced structurally
# rather than by review: no networking or async-runtime crate may enter the
# graph at all.
deny = [
  { name = "tokio" },
  { name = "async-std" },
  { name = "smol" },
  { name = "reqwest" },
  { name = "hyper" },
  { name = "ureq" },
  { name = "curl" },
  { name = "rustls" },
  { name = "native-tls" },
  { name = "openssl" },
  { name = "socket2" },
  { name = "mio" },
  { name = "actix-web" },
  { name = "actix-rt" },
  { name = "axum" },
]

# crates.io only: no git dependencies and no alternate registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
