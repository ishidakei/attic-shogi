[workspace]
resolver = "2"
members = ["crates/attic", "crates/attic-eval", "crates/attic-numa", "crates/attic-protocol", "crates/attic-search", "crates/attic-state", "crates/attic-storage", "crates/xtask"]

[workspace.package]
edition = "2024"
# One version for every workspace member. It expresses how far upstream
# YaneuraOu has been tracked and nothing else — never bumped for a divergence,
# fix, or addition. The USI `id name` derives from it.
version = "9.80.0"

# Fat LTO and a single codegen unit trade link time for run-time speed (~+7% NPS
# together with the `-C target-cpu=native` in `.cargo/config.toml`).
# `panic = "abort"` matches the reference build, compiled `-fno-exceptions
# -fno-rtti`: it strips unwind edges and `drop_in_place` chains out of the hot
# search code, shrinking a text segment the search code is I-cache sensitive
# about.
# Cargo ignores `panic` for test targets, so `cargo test --release` still
# unwinds. `strip` stays unset — perf work needs symbols.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
